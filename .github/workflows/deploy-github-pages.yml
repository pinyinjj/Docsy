name: Deployment to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main  # <-- specify the branch you want to deploy from
  pull_request:

env:
  REPO_NAME: ${{ github.event.repository.name }}
  REPO_OWNER: ${{ github.repository_owner }}

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0         # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.146.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Debug Git Info
        run: |
          echo "=== Git Status ==="
          git status
          echo "=== Git Log (last 3 commits) ==="
          git log --oneline -3
          echo "=== Test file Git info ==="
          git log --format="%H %ai %s" -1 "content/cn/blog/MAVLink/MAVLink-基于Pymavlink的任务规划实现.md" || echo "File not found or no history"
      
      - run: npm install
      
      - name: Build with Hugo
        run: hugo --enableGitInfo --baseURL https://${REPO_OWNER}.github.io/${REPO_NAME}/ --minify --verbose 2>&1 | tee hugo-build.log
      
      - name: Check GitInfo in build
        run: |
          echo "=== Checking for GitInfo in generated HTML ==="
          grep -r "GitInfo=YES" public/ | head -5 || echo "No GitInfo=YES found"
          grep -r "GitInfo=NO" public/ | head -5 || echo "No GitInfo=NO found"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }} # <-- specify same branch as above here
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
